version: 2
updates:
  # Root workspace (Angular libs, build tooling, shared devDependencies)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ["@angular/*", "ng-packagr"]
      fontawesome:
        patterns: ["@fortawesome/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "playwright", "jsdom", "@testing-library/*"]
      build-tooling:
        patterns: ["vite", "vite-plugin-*", "typescript", "prettier"]

  # React library workspace
  - package-ecosystem: "npm"
    directory: "/projects/react-toast"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      fontawesome:
        patterns: ["@fortawesome/*"]

  # React demo workspace
  - package-ecosystem: "npm"
    directory: "/projects/demo-react"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
