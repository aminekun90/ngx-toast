<div
  class="toast-item"
  [ngClass]="[toastClasses(), themeClass(), toast().toastClass]"
  [class.closing]="toast().closing"
  [class.pausable]="toast().pauseOnHover"
  role="alert"
  [attr.aria-live]="ariaLive()"
  aria-atomic="true"
  tabindex="0"
  (click)="onClose()"
  (keydown)="onKeydown($event)"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  (focusin)="onMouseEnter()"
  (focusout)="onMouseLeave()"
>
  <div class="toast-icon-wrapper">
    <fa-icon
      [icon]="icon()"
      class="toast-icon"
      [class.spinning]="toast().type === 'loading'"
    ></fa-icon>
  </div>

  <div class="toast-content">
    @if (toast().title) {
      <div class="toast-title">{{ toast().title }}</div>
    }
    <div class="toast-message">{{ toast().message }}</div>
  </div>

  <button
    type="button"
    class="toast-close"
    aria-label="Close notification"
    (click)="onClose(); $event.stopPropagation()"
  >
    &times;
  </button>

  @if (toast().progressBar && toast().duration) {
    <div
      class="toast-progress-bar"
      [class.increasing]="toast().progressAnimation === 'increasing'"
      [class.decreasing]="toast().progressAnimation === 'decreasing'"
      [style.animationDuration]="toast().duration + 'ms'"
    ></div>
  }
</div>
